[workspace]
resolver = "3"
members = ["libnamegen", "namegen-cli", "namegen-webui", "translit"]

[workspace.package]
authors = ["Jonathon Cobb"]
version = "0.1.6"

[workspace.dependencies]
anstream = "1.0"
anstyle = "1.0"
anyhow = "1.0"
byteorder = "1.5"
clap = "4.6"
crossterm = "0.29"
getrandom = "0.4"
glam = "0.33"
gloo-timers = "0.4"
image = { version = "0.25", default-features = false }
itertools = "0.15"
js-sys = "0.3"
lazy_static = "1.5"
leptos = "0.8"
leptos-use = "0.19"
rand = "0.10"
regex = "1.12"
semver = "1.0"
serde = "1.0"
serde_json = "1.0"
thiserror = "2.0"
toml = "1.1"
unicode-normalization = "0.1"
wasm-bindgen = "0.2"
web-sys = "0.3"
xml = "1.0"
