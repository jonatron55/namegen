name: Build Web UI

on:
  workflow_call:
    inputs:
      public-url:
        description: Base URL the assets are served from.
        type: string
        default: "/"
      artifact-name:
        type: string
        default: namegen-webui-dist
      package:
        description: Produce a release archive and upload it as an artifact.
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
          submodules: recursive

      - name: Add WASM target
        run: rustup target add wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install trunk
        run: cargo install --locked trunk@0.21.14

      - name: Build
        working-directory: namegen-webui
        run: trunk build --release --locked --public-url "${{ inputs.public-url }}"

      - uses: actions/upload-artifact@v7
        if: inputs.package
        with:
          name: ${{ inputs.artifact-name }}
          path: namegen-webui/dist/
          if-no-files-found: error
